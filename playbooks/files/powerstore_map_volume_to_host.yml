---
# Map PowerStore volume to a single host
# This playbook:
# 1. Finds the host on the PowerStore array
# 2. Maps the specified volume to the host
# Assumes host already exists (created by powerstore_create_hosts.yml)

- name: Map volume to host on PowerStore
  hosts: switch1, switch2
  gather_facts: false

  vars_files:
    - ../vars/powerstore_map_volume_to_host_vars.yml
    - ../vars/storage_array_vars.yml

  tasks:
    - name: Find the host on the array
      ansible.builtin.include_role:
        name: powerstore
        tasks_from: get_host.yml

    - name: Fail if host not found
      ansible.builtin.fail:
        msg: "Host {{ node_hostname }} not found on PowerStore array {{ array_hostname }}. Please create the host first using powerstore_create_hosts.yml"
      when: not found_host_flag

    - name: Map volume to host
      ansible.builtin.include_role:
        name: powerstore
        tasks_from: map_volume.yml
