---
- name: Unmap volume from multiple hosts
  hosts: localhost
  strategy: linear
  gather_facts: false
  roles:
    - unity
    - zoning
    - common

  vars_files:
    - ../vars/unity_delete_volume_vars.yml
    - ../vars/storage_array_vars.yml
    - ../vars/vcenter_vars.yml

  tasks:
    - name: Get hosts connected to volume
      ansible.builtin.include_role:
        name: unity
        tasks_from: get_volume_mapped_hosts.yml
      when: unmap_flag

    - name: Unmap volume from multiple hosts
      ansible.builtin.include_role:
        name: unity
        tasks_from: unmap_volume_multiple_hosts.yml
      when: unmap_flag

    - name: Delete volume 
      ansible.builtin.include_role:
        name: unity
        tasks_from: delete_volume.yml

