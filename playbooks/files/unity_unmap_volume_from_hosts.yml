---
- name: Unmap volume from multiple hosts
  hosts: localhost
  strategy: linear
  gather_facts: false
  roles:
    - unity
    - zoning
    - common

  vars_files:
    - ../vars/unity_unmap_volume_from_hosts_vars.yml
    - ../vars/storage_array_vars.yml
    - ../vars/vcenter_vars.yml

  tasks:
    - name: Unmap volume from multiple hosts
      ansible.builtin.include_role:
        name: unity
        tasks_from: unmap_volume_multiple_hosts.yml

