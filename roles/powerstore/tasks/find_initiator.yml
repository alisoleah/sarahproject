---
- name: Look for the initiator in the initiator list on PowerStore
  ansible.builtin.set_fact:
    found_initiator: "{{ all_fc_initiators | select('search', item, ignorecase=True) | list }}"

- name: Set the flag whether an initiator is found or not
  ansible.builtin.set_fact:
    found_initiator_flag: "{{ found_initiator | length > 0 }}"

- name: Print initiator match status
  ansible.builtin.debug:
    msg: "Initiator {{ item }}: {{ 'FOUND on PowerStore' if found_initiator_flag else 'NOT FOUND on PowerStore' }}"

- name: Set initiators list on the array
  ansible.builtin.set_fact:
    found_initiator_list: "{{ found_initiator_list + found_initiator }}"
  when: found_initiator_flag
