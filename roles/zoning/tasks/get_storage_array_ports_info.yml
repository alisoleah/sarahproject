---
- name: Retrieve port info for storage array HBA PWWNs
  delegate_to: localhost
  block:
    - name: Retrieve port info from Unity system
      unity_port_info:
        unispherehost: "{{ lookup('vars', array_hostname + '_unispherehost') }}"
        username: "{{ lookup('vars', array_hostname + '_username') }}"
        password: "{{ lookup('vars', array_hostname + '_password') }}"
        pwwn: "{{ item }}"
      register: result
      with_items: "{{ storage_pwwn_list }}"
      when: array_type == 'unity'

    - name: Set port info
      ansible.builtin.set_fact:
        port_name_list: "{{ port_name_list | default([]) + [item.port_name] }}"
      with_items: "{{ result.results }}"
      when: array_type == 'unity'

    - name: Retrieve port info from VPLEX system
      vplex_port_info:
        vplexhost: "{{ lookup('vars', array_hostname + '_vplexhost') }}"
        vplexuser: "{{ lookup('vars', array_hostname + '_vplexuser') }}"
        vplexpassword: "{{ lookup('vars', array_hostname + '_vplexpassword') }}"
        pwwn: "{{ item }}"
      register: result
      with_items: "{{ storage_pwwn_list }}"
      when: array_type == 'vplex'

    - name: Set port info
      ansible.builtin.set_fact:
        port_name_list: "{{ port_name_list | default([]) + [item.port_name] }}"
      with_items: "{{ result.results }}"
      when: array_type == 'vplex'

    - name: Print WWPN port info for the storage array
      ansible.builtin.debug:
        msg: "The retrieved PWWN port info for the array {{ array_hostname }} ports {{ storage_pwwn_list }} are {{ port_name_list }}."

  rescue:
    - name: Error obtaining port info for the Storage array
      ansible.builtin.fail:
        msg: "Failed to obatin the HBA ports info for the array {{ array_hostname }}."
