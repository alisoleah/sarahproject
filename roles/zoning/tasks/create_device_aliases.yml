---
- name: Configure device aliases on the switch
  block:
    - name: Create device aliases on the switch for linux and windows servers
      cisco.nxos.nxos_devicealias:
        da: >
          {%- set aliases = [] -%}
          {%- for i in range(switch_node_pwwn_list|length) -%}
          {%- set _ = aliases.append({'name': 'auto_' ~ node_hostname ~ '_fc_' ~ '%02d' | format(i + 1), 'pwwn': switch_node_pwwn_list[i]}) -%}
          {%- endfor -%}
          {{ aliases }}
        distribute: "{{ hostvars[inventory_hostname]['alias_distribute_flag'] }}"
        mode: "{{ hostvars[inventory_hostname]['alias_mode_type_flag'] }}"
      when: node_type != 'esxi'

    - name: Create device aliases on the switch for esxi servers
      cisco.nxos.nxos_devicealias:
        da: >
          {%- set aliases = [] -%}
          {%- for i in range(switch_node_pwwn_list|length) -%}
          {%- set _ = aliases.append({'name': 'auto_' ~ node_hostname ~ '_' ~ switch_node_pwwn_list_vmhba[i], 'pwwn': switch_node_pwwn_list[i]}) -%}
          {%- endfor -%}
          {{ aliases }}
        distribute: "{{ hostvars[inventory_hostname]['alias_distribute_flag'] }}"
        mode: "{{ hostvars[inventory_hostname]['alias_mode_type_flag'] }}"
      when: node_type == 'esxi'

  rescue:
    - name: Error to aliases on switch
      ansible.builtin.fail:
        msg: "Unable to create device aliases for the host {{ node_hostname }} on the switch {{ inventory_hostname }}"

