---
- name: Create Volume
  delegate_to: localhost
  run_once: true
  block:
    - name: Create block volume
      dellemc.unity.volume:
        unispherehost: "{{ lookup('vars', array_hostname + '_unispherehost') }}"
        username: "{{ lookup('vars', array_hostname + '_username') }}"
        password: "{{ lookup('vars', array_hostname + '_password') }}"
        validate_certs: "{{ validate_certs }}"
        vol_name: "{{ vol_name }}"
        description: "{{ description }}"
        pool_name: "{{ pool_name }}"
        size: "{{ size_gb }}"
        cap_unit: "{{ cap_gb }}"
        is_thin: "{{ is_thin }}"
        compression: "{{ compression }}"
        advanced_dedup: "{{ advanced_dedup }}"
        state: "{{ state_present }}"
      register: unity_vol_info

    - name: Display success message
      ansible.builtin.debug:
        msg: "The volume is created successfully."
  rescue:
    - name: Fail if cannot find storage pools
      ansible.builtin.fail:
        msg: "Unable to create the volume."

