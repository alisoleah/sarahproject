---
- name: Delete volume
  delegate_to: localhost
  run_once: true
  block:
    - name: Delete volume
      dellemc.unity.volume:
        unispherehost: "{{ lookup('vars', array_hostname + '_unispherehost') }}"
        username: "{{ lookup('vars', array_hostname + '_username') }}"
        password: "{{ lookup('vars', array_hostname + '_password') }}"
        validate_certs: "{{ validate_certs }}"
        vol_name: "{{ vol_name }}"
        state: "{{ state_absent }}"

  rescue:
    - name: Print Failure message in case of mapping issue
      ansible.builtin.fail:
        msg: "Unable to delete the volume {{ vol_name }}."
